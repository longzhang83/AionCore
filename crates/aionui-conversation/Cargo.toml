[package]
name = "aionui-conversation"
version.workspace = true
edition.workspace = true

[dependencies]
aionui-common.workspace = true
aionui-db.workspace = true
aionui-project.workspace = true
aionui-api-types.workspace = true
aionui-realtime.workspace = true
aionui-auth.workspace = true
aionui-ai-agent.workspace = true
aionui-extension.workspace = true
aionui-mcp.workspace = true
aionui-runtime.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
regex.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
async-trait.workspace = true
thiserror.workspace = true
# G02-b per-turn run dirs: manifest walk + digest. All three are existing
# workspace deps (no new crates), newly referenced by this crate.
walkdir.workspace = true
sha2.workspace = true
hex.workspace = true
# Run admission receive face (T0-ACP-ADMISSION-DELIVERY B2a): canonical
# UUIDv4 idempotency-key validation + bounded body reads.
uuid.workspace = true
http-body-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
tracing-subscriber.workspace = true
sqlx.workspace = true
# Router-level tests drive the service directly through tower::ServiceExt.
tower = { workspace = true, features = ["util"] }
wiremock.workspace = true
# Admission tests mint RS256 ACP service tokens like the B1 verifier tests.
jsonwebtoken.workspace = true
# Enable the `AgentInstance::Mock` variant so tests can build fake agents
# through the trait-object escape hatch without spawning real CLI processes.
aionui-ai-agent = { workspace = true, features = ["test-support"] }
# Force-kill convergence tests (force_kill_convergence.rs) build a real
# `AgentInstance::Session` over a fake `SessionBackend`, so they need the session
# crate's trait + test doubles. Dev-only; never shipped.
aionui-session = { workspace = true, features = ["test-support"] }
futures-util = { workspace = true }
async-trait.workspace = true
